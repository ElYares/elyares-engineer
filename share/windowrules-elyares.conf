# elyares-engineer - la app en ventana (`elyares-ctl window`)
#
# Flotante y centrada: el tablero y el chat miden ~600 px de ancho, y metida en
# el mosaico la ventana se estira a media pantalla con el contenido pegado
# arriba y todo lo demas en negro.
#
# Ojo: en windowrule la REGLA va primero y el match despues, si no queda inerte.

windowrule = float on,        match:class ^(dev\.elyares\.Engineer)$
windowrule = size 660 760,    match:class ^(dev\.elyares\.Engineer)$
windowrule = center on,       match:class ^(dev\.elyares\.Engineer)$

# El fondo es el de la isla, opaco: la opacidad global de omarchy lo atenua.
windowrule = opacity 1.0 1.0, match:class ^(dev\.elyares\.Engineer)$
